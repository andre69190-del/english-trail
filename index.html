/* Layout: App-Shell, eine Spalte (max 720px), Kopfzeile sticky, Navigation unten fixiert.
   Motiv: Wandermarkierung = weiß-farbig-weiß Streifen; Akzentfarbe Blau (English Trail). */
:root {
  --bg: #eef1f3; --surface: #ffffff; --surface-2: #f6f8f9; --ink: #14212b; --muted: #546572; --line: #d3dce2;
  --red: #1d4f91; --on-red: #ffffff; --amber: #9a5b00; --amber-soft: #fbeacb;
  --good: #1b7343; --good-soft: #dcf1e4; --bad: #a8231c; --bad-soft: #f9e0dd;
  --map-land: #dfe7ec; --map-edge: #98abb8; --route: #7b8d99;
  --t-red: #d02a2a; --t-blue: #1f5fbf; --t-green: #1f8a4c; --t-yellow: #d9a800; --t-black: #22272b; --blaze-white: #ffffff;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px; --r-sm: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151a; --surface: #18222a; --surface-2: #1d2932; --ink: #e7eef3; --muted: #9fb0bc; --line: #2b3a46;
  --red: #8fb6ff; --on-red: #0b1424; --amber: #f2ad45; --amber-soft: #3a2b12;
  --good: #57c98a; --good-soft: #163426; --bad: #ff8a7f; --bad-soft: #3e1e1b;
  --map-land: #1f2b34; --map-edge: #3d515f; --route: #6c8291;
  --t-red: #ff6b6b; --t-blue: #6a9dff; --t-green: #4fc283; --t-yellow: #f1c53a; --t-black: #dfe6eb; --blaze-white: #2a3843;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f151a; --surface: #18222a; --surface-2: #1d2932; --ink: #e7eef3; --muted: #9fb0bc; --line: #2b3a46;
  --red: #8fb6ff; --on-red: #0b1424; --amber: #f2ad45; --amber-soft: #3a2b12;
  --good: #57c98a; --good-soft: #163426; --bad: #ff8a7f; --bad-soft: #3e1e1b;
  --map-land: #1f2b34; --map-edge: #3d515f; --route: #6c8291;
  --t-red: #ff6b6b; --t-blue: #6a9dff; --t-green: #4fc283; --t-yellow: #f1c53a; --t-black: #dfe6eb; --blaze-white: #2a3843;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* Shell */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; margin-right: auto;
  background: none; border: 0; padding: 4px 0; color: inherit; cursor: pointer; min-height: 44px; }
.brand:hover { color: var(--red); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: .85rem; font-weight: 700; }
.chip.amber { background: var(--amber-soft); border-color: transparent; color: var(--amber); }
main { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 20px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); } /* PATCH003 */
button.chip { cursor: pointer; min-height: 40px; } /* PATCH004 */
.clues { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; font-size: 1.05rem; }
.clues li::marker { color: var(--red); font-weight: 700; }
.nav button { background: none; border: 0; padding: 10px 4px 12px; display: grid; justify-items: center; gap: 2px; font-size: .78rem; font-weight: 700; color: var(--muted); }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--red); }

/* Wandermarkierung (PTTK): weiß – Farbe – weiß */
.blaze { display: inline-grid; grid-template-rows: 1fr 1.3fr 1fr; width: 22px; height: 16px; border-radius: 2px; overflow: hidden; flex: none; box-shadow: 0 0 0 1px var(--line); }
.blaze i { display: block; background: var(--blaze-white); }
.blaze i:nth-child(2) { background: var(--c, var(--t-red)); }
.tr-red { --c: var(--t-red); } .tr-blue { --c: var(--t-blue); } .tr-green { --c: var(--t-green); } .tr-yellow { --c: var(--t-yellow); } .tr-black { --c: var(--t-black); }

/* Flächen */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sep { height: 1px; background: var(--line); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--r-sm); padding: 12px 16px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); min-height: 48px; text-align: center; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--red); color: var(--on-red); border-color: var(--red); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: default; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; flex: none; }
.icon-btn svg { width: 22px; height: 22px; }

/* Startseite */
.hero { display: grid; gap: 12px; }
.hero-top { display: flex; gap: 16px; align-items: center; }
.ring { width: 92px; height: 92px; flex: none; }
.ring text { font-family: var(--f-display); font-weight: 800; fill: var(--ink); }
.map-wrap { position: relative; }
.map { width: 100%; height: auto; display: block; }
.map .land { fill: var(--map-land); stroke: var(--map-edge); stroke-width: 2; stroke-linejoin: round; }
.map .route { fill: none; stroke: var(--route); stroke-width: 3; stroke-dasharray: 2 9; stroke-linecap: round; }
.map .route-done { fill: none; stroke: var(--red); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.map .node { cursor: pointer; }
.map .node circle.dot { fill: var(--surface); stroke: var(--map-edge); stroke-width: 3; }
.map .node.open circle.dot { stroke: var(--red); }
.map .node.done circle.dot { fill: var(--red); stroke: var(--red); }
.map .node.next circle.halo { fill: var(--red); opacity: .18; }
.map .node text { font-family: var(--f-display); font-weight: 700; font-size: 22px; fill: var(--ink); paint-order: stroke; stroke: var(--map-land); stroke-width: 6px; }
.map .node.locked text { fill: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .map .node.next circle.halo { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } }
@keyframes pulse { 0%,100% { transform: scale(.8); opacity: .25; } 50% { transform: scale(1.25); opacity: .08; } }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; min-height: 92px; align-content: start; }
.tile:hover { background: var(--surface-2); }
.tile .t { font-family: var(--f-display); font-weight: 700; font-size: 1.02rem; }
.tile .d { font-size: .85rem; color: var(--muted); }
.tile .badge { justify-self: start; margin-top: 4px; }
.badge { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); }
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.next { background: var(--red); color: var(--on-red); }
.next-box { border-left: 4px solid var(--red); }
.welcome { border-left: 4px solid var(--amber); }

.bar { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--red); border-radius: 999px; }
.bar.amber > i { background: var(--amber); }
.bar.muted > i { background: var(--route); }

.banner { border-radius: var(--r); padding: 14px 16px; background: var(--amber-soft); color: var(--ink); display: grid; gap: 4px; border: 1px solid transparent; }
.banner strong { font-family: var(--f-display); }

/* Stadt */
.city-head { display: grid; gap: 8px; }
.city-head .pl { font-family: var(--f-display); font-size: 2.4rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.tip { border-left: 4px solid var(--amber); background: var(--surface); border-radius: 0 var(--r-sm) var(--r-sm) 0; padding: 12px 14px; }
.list { display: grid; gap: 0; }
.list .li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.list .li:last-child { border-bottom: 0; }
.list .li .grow { flex: 1; min-width: 0; }
.wdiff { display: block; font-size: 1.1rem; margin: 6px 0; line-height: 1.7; }
.wd.ok { color: var(--good); }
.wd.no { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; font-weight: 700; }
.rv-pl { font-family: var(--f-display); font-size: 1.35rem; font-weight: 700; overflow-wrap: anywhere; margin: 0; }
.rv-secs { flex-wrap: wrap; }
.chip[aria-pressed="true"] { background: var(--red); color: var(--on-red); border-color: var(--red); }
.good-t { color: var(--good); }
.conj-tab { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.conj-tab table { border-collapse: collapse; width: 100%; font-size: .95rem; }
.conj-tab th { text-align: left; font-weight: 400; color: var(--muted); padding: 2px 6px 2px 0; white-space: nowrap; }
.conj-tab td { padding: 2px 0; }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; min-height: 32px; }
.linkish:hover { color: var(--red); }
@media (max-width: 380px) { .conj-tab { grid-template-columns: 1fr; } }
.theme-card { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; cursor: pointer; font: inherit; color: inherit; }
.theme-ico { font-size: 1.8rem; line-height: 1; }
.theme-lesson { gap: 10px; align-items: center; }
.map-seg { margin: 4px 4px 6px; }
.chat-log { gap: 10px; }
#ch-f textarea, .fld select { width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; font: inherit; }
.fld select { padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
#ch-f textarea { min-height: 64px; font-family: var(--f-body); font-size: 1rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); }
.chat-fix { margin-top: 6px; }
.chat-fix span { color: var(--good); font-weight: 700; }
.news-ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.news-hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; width: 100%; }
.vc-out { white-space: pre-wrap; font-size: .78rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px; max-height: 320px; overflow: auto; margin: 0; }
.pl-word { font-family: var(--f-display); font-weight: 700; }
.box-dots { display: inline-flex; gap: 3px; }
.box-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.box-dots i.on { background: var(--good); }

/* Spiel */
.game { display: grid; gap: 16px; }
.game-top { display: flex; gap: 12px; align-items: center; }
.game-top .bar { flex: 1; }
.lives { display: inline-flex; gap: 4px; }
.lives i { width: 14px; height: 14px; border-radius: 3px; background: var(--red); }
.lives i.off { background: var(--line); }
.prompt { display: grid; gap: 8px; padding: 8px 0; }
.prompt .big { font-family: var(--f-display); font-size: clamp(1.6rem, 6vw, 2.3rem); font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.prompt .sentence { font-family: var(--f-display); font-size: clamp(1.3rem, 5vw, 1.7rem); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.prompt .blank { display: inline-block; min-width: 3.5em; border-bottom: 3px solid var(--red); }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 14px 16px; font-size: 1.05rem; font-weight: 700; min-height: 52px; overflow-wrap: anywhere; }
.opt:hover:not([disabled]) { border-color: var(--route); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.answer-in { width: 100%; font-size: 1.25rem; padding: 14px 16px; border-radius: var(--r-sm); border: 2px solid var(--line); background: var(--surface); }
.answer-in:focus { border-color: var(--red); outline: none; }
.pl-keys { display: flex; flex-wrap: wrap; gap: 6px; }
.pl-keys button { min-width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; }
.tiles-build { display: flex; flex-wrap: wrap; gap: 8px; min-height: 56px; padding: 10px; border: 2px dashed var(--line); border-radius: var(--r-sm); }
.tiles-pool { display: flex; flex-wrap: wrap; gap: 8px; }
.wtile { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; min-height: 44px; }
.wtile.used { visibility: hidden; }
.feedback { border-radius: var(--r-sm); padding: 14px 16px; display: grid; gap: 6px; }
.feedback.ok { background: var(--good-soft); }
.feedback.no { background: var(--bad-soft); }
.feedback .h { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; }
.feedback.ok .h { color: var(--good); }
.feedback.no .h { color: var(--bad); }
.combo { font-family: var(--f-display); font-weight: 800; color: var(--amber); }

ufus landet stolz auf deiner Schulter.","An der Millennium Bridge winkt Emma dir zu. „You did it! Your English is brilliant now.“ Rufus landet stolz auf deiner Schulter."],"lines":[{"u":"oxf","pl":"Greetings from Oxford! I visited a very old library today.","tr":["Grüße aus Oxford! Ich habe heute eine sehr alte Bibliothek besucht.","Grüße aus Oxford! Ich habe heute eine sehr alte Bibliothek besucht."],"bridge":["Rufus flattert los: „Emma ist schon weiter nach Cambridge. Hinterher!“","Rufus flattert los: „Emma ist schon weiter nach Cambridge. Hinterher!“"]},{"u":"cam","pl":"I rode a bike along the river. I got lost twice!","tr":["Ich bin am Fluss Rad gefahren. Ich habe mich zweimal verfahren!","Ich bin am Fluss Rad gefahren. Ich habe mich zweimal verfahren!"],"bridge":["Rufus kichert: „Zweimal verfahren – typisch Emma. Nächste Karte: Stratford.“","Rufus kichert: „Zweimal verfahren – typisch Emma. Nächste Karte: Stratford.“"]},{"u":"str","pl":"I saw a play by Shakespeare. I was so excited!","tr":["Ich habe ein Stück von Shakespeare gesehen. Ich war so aufgeregt!","Ich habe ein Stück von Shakespeare gesehen. Ich war so aufgeregt!"],"bridge":["Rufus verbeugt sich wie ein Schauspieler. „Weiter zu den alten Steinen!“","Rufus verbeugt sich wie ein Schauspieler. „Weiter zu den alten Steinen!“"]},{"u":"sth","pl":"We watched the sunrise at Stonehenge. It was magic!","tr":["Wir haben in Stonehenge den Sonnenaufgang angeschaut. Es war magisch!","Wir haben in Stonehenge den Sonnenaufgang angeschaut. Es war magisch!"],"bridge":["Rufus gähnt: „So früh aufgestanden … Emma wohnt jetzt bei einer Gastfamilie in Canterbury.“","Rufus gähnt: „So früh aufgestanden … Emma wohnt jetzt bei einer Gastfamilie in Canterbury.“"]},{"u":"cnt","pl":"My host family is very nice, but I must be home by ten.","tr":["Meine Gastfamilie ist sehr nett, aber ich muss um zehn zu Hause sein.","Meine Gastfamilie ist sehr nett, aber ich muss um zehn zu Hause sein."],"bridge":["Rufus: „Um zehn! Da schlafe ich schon. Ab ans Meer – nach Cornwall!“","Rufus: „Um zehn! Da schlafe ich schon. Ab ans Meer – nach Cornwall!“"]},{"u":"siv","pl":"It rained in the morning, but in the afternoon I went surfing!","tr":["Morgens hat es geregnet, aber nachmittags war ich surfen!","Morgens hat es geregnet, aber nachmittags war ich surfen!"],"bridge":["Rufus schüttelt Wassertropfen aus dem Gefieder: „Jetzt in die Berge von Wales!“","Rufus schüttelt Wassertropfen aus dem Gefieder: „Jetzt in die Berge von Wales!“"]},{"u":"snw","pl":"I climbed the highest mountain in Wales. My legs hurt!","tr":["Ich bin auf den höchsten Berg von Wales gestiegen. Meine Beine tun weh!","Ich bin auf den höchsten Berg von Wales gestiegen. Meine Beine tun weh!"],"bridge":["Rufus fliegt voraus nach Norden: „Glasgow! Da ist heute ein Spiel.“","Rufus fliegt voraus nach Norden: „Glasgow! Da ist heute ein Spiel.“"]},{"u":"gla","pl":"I've never seen so many football fans!","tr":["Ich habe noch nie so viele Fußballfans gesehen!","Ich habe noch nie so viele Fußballfans gesehen!"],"bridge":["Rufus trägt jetzt einen blauen Schal. „Zur Insel Skye – da gibt es Delfine!“","Rufus trägt jetzt einen blauen Schal. „Zur Insel Skye – da gibt es Delfine!“"]},{"u":"sky","pl":"A dolphin swam next to our boat. We should protect the sea!","tr":["Ein Delfin ist neben unserem Boot geschwommen. Wir sollten das Meer schützen!","Ein Delfin ist neben unserem Boot geschwommen. Wir sollten das Meer schützen!"],"bridge":["Rufus ist ganz still vor Staunen. Dann: „Übers Meer nach Irland – Galway!“","Rufus ist ganz still vor Staunen. Dann: „Übers Meer nach Irland – Galway!“"]},{"u":"gal","pl":"Would you like to come to a music session with me? I danced all night!","tr":["Möchtest du mit mir zu einer Musik-Session? Ich habe die ganze Nacht getanzt!","Möchtest du mit mir zu einer Musik-Session? Ich habe die ganze Nacht getanzt!"],"bridge":["Rufus tanzt auf einem Bein. „Hunger! Auf zum Markt in Cork.“","Rufus tanzt auf einem Bein. „Hunger! Auf zum Markt i   function schSentQ(sv, all, kind) {

  var LD = null, LD_Q_MS = 20000, LD_WAIT_MS = 25000;

    var topic = 'realtime:et_live_' + code, ref = 0, hb = null, ws = new WebSocket(url), joined = false;
    var rt = {
      send: function (ev, payload) { if (ws.readyState === 1 && joined) ws.send(JSON.stringify({ topic: topic, event: 'broadcast', payload: { type: 'broadcast', event: ev, payload: payload }, ref: String(++ref), join_ref: '1' })); },
      close: function () { clearInterval(hb); try { ws.close(); } catch (e) {} }

      ws.send(JSON.stringify({ topic: topic, event: 'phx_join', payload: { config: { broadcast: { self: false, ack: false }, presence: { key: '' }, postgres_changes: [], private: false }, access_token: SB_KEY }, ref: String(++ref), join_ref: '1' }));
      hb = setInterval(function () { if (ws.readyState === 1) ws.send(JSON.stringify({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(++ref) })); }, 25000);
    };

    if (mode === 'wr3') { var w3 = S.mistakes.map(byId).filter(Boolean).slice(0, 3); if (!w3.length) return go('home'); return runGame({ title: t('wr_title'), qs: mixedFor(w3, pool.concat(w3), 6) }); }
    if (mode === 'welcome') {
      var wsrc = allWords().filter(function (x) { return S.cards[x.id]; }).sort(function (a, b) { return S.cards[a.id].box - S.cards[b.id].box; }).slice(0, 5);

    if (mode === 'survival') return runGame({ title: t('survival'), qs: mixedFor(pool, pool, 300).filter(function (q) { return q.type === 'mc'; }), lives: 3, survival: S.diff === 'hard' ? 6 : (S.diff === 'medium' ? 8 : 12) });

      routeIdx().forEach(function (i) { var w = C.sample(wordsOf(i), 3, R); [qMC(w[0], wordsOf(i), 'x2pl'), qType(w[1]), qType(w[2])].forEach(function (q) { q.city = i; qs.push(q); }); });

    if (mode === 'letterquiz') return runGame({ title: t('lq'), qs: C.shuffle(D.letterQuiz, R).map(qLetter), letterQuiz: true, back: 'letter' });

      qs = C.shuffle(D.sounds, R).slice(0, 6).map(qSound);
      for (var k = 0; k < 4; k++) qs.push(qHearWord(pool));

  /* ---------- Nach Thema (3.0): dieselben Lektionen aus Szlak 1, Szlak 2 und den Paketen, nach Alltagsthema gebündelt ---------- */

  /* ---------- KI-Gespräch (3.1): Rollenspiel zur Szene einer Stadt, über die eigene Supabase-Funktion ps-chat ----------
     Nur mit Konto (Tageslimit pro Konto) und online. Der KI-Schlüssel liegt auf dem Server, nie in der App. */
  var CH = { ui: null, msgs: [], busy: false, err: '', used: 0, limit: 0, avail: null, talk: true };
  function chatScenario(ui) {
    if (ui && typeof ui === 'object') return { txt: ui.txt, lv: 'A2', open: ui.open };
    if (ui == null || !U[ui]) return { txt: t('chat_free_sc'), lv: szlakOf(nextUnit()) >= 2 ? 'A2' : 'A1', open: 'Cześć! Jak się masz?' };
    var u = U[ui], sc = u.scene;
    return { txt: (u.pack ? cityName(u) : u.city) + ': ' + L(u.title) + (sc ? ' – ' + L(sc.intro) : ''), lv: u.sch ? 'K' + u.sch : (u.pack || szlakOf(ui) >= 2 ? 'A2' : 'A1'), open: sc ? sc.steps[0].npc[0] : 'Hello! How are you?' };
  }
  function chatReset(ui) { CH.ui = ui; CH.err = ''; CH.msgs = [{ role: 'assistant', content: chatScenario(ui).open }]; }
  function renderChat(arg) {
    if (arg !== undefined && arg !== CH.ui) chatReset(arg); else if (!CH.msgs.length) chatReset(CH.ui);
    var logged = A && A.uid, html = '<button class="btn ghost" id="back" style="justify-self:start;padding-left:0">← ' + esc(t('back')) + '</button><h1>' + esc(t('chat')) + ' <span class="badge">Beta</span></h1>';
    if (!navigator.onLine) html += '<section class="card"><p>' + esc(t('chat_offline')) + '</p></section>';
    else if (!logged) html += '<section class="card stack"><p>' + esc(t('chat_login')) + '</p><button class="btn primary" id="ch-login" style="justify-self:start">' + esc(t('sync_login')) + ' →</button></section>';
    else if (CH.avail === false) html += '<section class="card"><p>' + esc(t('chat_soon')) + '</p></section>';
    else {
      var sc = chatScenario(CH.ui), opts = '<option value="">' + esc(t('chat_free')) + '</option>' + openUnits().map(function (i) { return '<option value="' + i + '"' + (i === CH.ui ? ' selected' : '') + '>' + esc((U[i].pack ? cityName(U[i]) : U[i].city) + ' – ' + L(U[i].title)) + '</option>'; }).join('');
      html += '<section class="card stack"><label class="fld">' + esc(t('chat_sc')) + '<select id="ch-sc">' + opts + '</select></label><p class="small muted">' + esc(sc.txt) + ' · ' + esc(t('chat_lv')) + ' ' + sc.lv + '</p></section>' +
        '<section class="stack chat-log" id="ch-log" aria-live="polite">' + CH.msgs.map(function (m, i) {
          if (m.role === 'assistant') return '<div class="npc"><div class="row" style="flex-wrap:nowrap;align-items:start"><button class="icon-btn" data-say="' + esc(m.content) + '" aria-label="' + esc(t('listen_again')) + '">' + I.spk + '</button><b lang="en">' + esc(m.content) + '</b></div></div>';
          return '<div class="me"><b lang="en">' + esc(m.content) + '</b>' + (m.fix ? '<div class="small chat-fix"><span>' + esc(t('chat_better')) + ':</span> <b lang="en">' + esc(m.fix) + '</b></div>' : '') + (m.hint ? '<div class="small muted">' + esc(m.hint) + '</div>' : '') + '</div>';
        }).join('') + (CH.busy ? '<div class="npc"><span class="muted">…</span></div>' : '') + '</section>' +
        (CH.err ? '<p class="small" role="status" style="color:var(--bad)">' + esc(CH.err) + '</p>' : '') +
        '<form id="ch-f" class="stack"><textarea id="ch-in" rows="2" maxlength="400" lang="en" placeholder="' + esc(t('chat_ph')) + '" aria-label="' + esc(t('chat_ph')) + '"></textarea>' + plKeys() +
        '<div class="row"><button class="btn primary" style="flex:1"' + (CH.busy ? ' disabled' : '') + '>' + esc(t('chat_send')) + '</button>' + ((window.SpeechRecognition || window.webkitSpeechRecognition) ? '<button type="button" class="btn" id="ch-mic" aria-label="' + esc(t('inp_say')) + '">' + I.mic + '</button>' : '') + '</div></form>' +
        '<div class="row small muted" style="justify-content:space-between"><label class="row"><input type="checkbox" id="ch-talk"' + (CH.talk ? ' checked' : '') + '> ' + esc(t('chat_talk')) + '</label><span class="num">' + (CH.limit ? esc(t('chat_used').replace('{n}', CH.used).replace('{l}', CH.limit)) : '') + '</span></div>' +
        '<button class="btn ghost" id="ch-new" style="justify-self:start">↺ ' + esc(t('chat_new')) + '</button><p class="small muted">' + esc(t('chat_note')) + '</p>';
    }
    shell(html);
    document.getElementById('back').onclick = function () { if (CH.ui && typeof CH.ui === 'object') go('exam'); else if (CH.ui != null && U[CH.ui] && !U[CH.ui].pack && arg != null) go('city', CH.ui); else go('practice'); };
    var lg = document.getElementById('ch-login'); if (lg) lg.onclick = function () { go('me'); setTimeout(function () { var y = document.getElementById('sync'); if (y) y.scrollIntoView({ block: 'center' }); }, 50); };
    if (logged && navigator.onLine && CH.avail === null) {
      sbToken().then(function () { return sbFetch('/functions/v1/et-chat', { method: 'POST', auth: true, body: { ping: true } }); }).then(function (j) { CH.avail = !!(j && j.configured); CH.limit = (j && j.limit) || 0; if (tab === 'chat') renderChat(); }, function () { CH.avail = false; if (tab === 'chat') renderChat(); });
    }
    var log = document.getElementById('ch-log'); if (log) log.lastElementChild && log.lastElementChild.scrollIntoView({ block: 'nearest' });
    document.querySelectorAll('[data-say]').forEach(function (b) { b.onclick = function () { speak(b.getAttribute('data-say')); }; });
    var sel = document.getElementById('ch-sc'); if (sel) sel.onchange = function () { chatReset(sel.value === '' ? null : +sel.value); renderChat(); };
    var nw = document.getElementById('ch-new'); if (nw) nw.onclick = function () { chatReset(CH.ui); renderChat(); };

      var mic = document.getElementById('ch-mic'); if (mic) mic.onclick = function () {
        try { var Rec = window.SpeechRecognition || window.webkitSpeechRecognition, rec = new Rec(); rec.lang = TL(); rec.interimResults = false; mic.disabled = true;
          rec.onresult = function (e) { inp.value = (inp.value ? inp.value + ' ' : '') + (e.results[0][0].transcript || ''); };
          rec.onend = function () { mic.disabled = false; inp.focus(); }; rec.onerror = function () { mic.disabled = false; toast(t('no_mic')); }; rec.start();
        } catch (e) { toast(t('no_mic')); }
      };
      document.getElementById('ch-f').onsubmit = function (e) { e.preventDefault(); chatSend(inp.value); };
    }
  }
  function chatSend(text) {

  function rvSend(msg, ctx) { return sbFetch('/rest/v1/et_feedback', { method: 'POST', prefer: 'return=minimal', body: { msg: String(msg).slice(0, 1000), ctx: String(ctx).slice(0, 500), lang: S.base === 'en' ? 'en' : 'de', ver: APP_VER } }); } /* Tabelle erlaubt nur de/en; „review“ steht im ctx */

    if (cur) {

        '<div class="row" style="align-items:start;flex-wrap:nowrap"><p class="rv-pl grow">' + esc(cur.pl) + '</p><button class="icon-btn" id="rv-say" aria-label="' + esc(RVX.listen) + '">' + I.spk + '</button></div>' +
        (cur.de ? '<p class="small" lang="de">DE: ' + esc(cur.de) + '</p>' : '') + (cur.en ? '<p class="small" lang="en">EN: ' + esc(cur.en) + '</p>' : '') +

          : '<div class="row"><button class="btn primary" id="rv-ok" style="flex:1">' + esc(RVX.ok) + '</button><button class="btn" id="rv-bad" style="flex:1">' + esc(RVX.bad) + '</button></div><button class="btn ghost" id="rv-skip" style="justify-self:start">' + esc(RVX.skip) + ' →</button>') +
